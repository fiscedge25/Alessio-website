<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Garden Made For You</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="vignette"></div>
    <div class="grain"></div>
    <main class="copy" aria-label="A garden made for you">
      <p class="eyebrow">with all my heart</p>
      <h1>These flowers<br />are for you</h1>
      <div class="rule"><i></i><span>✦</span><i></i></div>
    </main>
    <div class="hint">move gently</div>
    <canvas id="garden"></canvas>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
    </script>
    <script>
      /* BuiltWithSabba: personalise the dedication from ?to=&from= (the server
         writes the query string; textContent only, never HTML). */
      (function () {
        var q = new URLSearchParams(location.search);
        var to = q.get("to"), from = q.get("from");
        if (to) {
          var h = document.querySelector(".copy h1");
          h.textContent = "These flowers";
          h.appendChild(document.createElement("br"));
          h.appendChild(document.createTextNode("are for " + to));
        }
        if (from) document.querySelector(".copy .eyebrow").textContent = "with all my heart, " + from;
      })();
    </script>
    <script type="module" src="script.js"></script>
  </body>
</html>
